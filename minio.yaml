apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: default
spec:
  ports:
    - port: 9000
      name: api
    - port: 9001
      name: console
  selector:
    app: minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: default
spec:
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio:fixed       # <--- USE THE FIXED IMAGE
          imagePullPolicy: Never   # <--- FORCE LOCAL
          command:
            - /bin/sh
            - -c
            - minio server /data --console-address :9001
          env:
            - name: MINIO_ROOT_USER
              value: "admin"
            - name: MINIO_ROOT_PASSWORD
              value: "password123"
          ports:
            - containerPort: 9000
            - containerPort: 9001
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-console-route
  namespace: default
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/minio`)
      kind: Rule
      services:
        - name: minio
          port: 9001
      middlewares:
        - name: minio-stripprefix
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: minio-stripprefix
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /minio
