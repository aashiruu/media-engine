apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-worker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-worker
  template:
    metadata:
      labels:
        app: media-worker
    spec:
      containers:
        - name: media-worker
          image: media-engine:v4    # <--- Same Image
          imagePullPolicy: Never
          # <--- Different Command
          command: ["celery", "-A", "main.celery_app", "worker", "--loglevel=info"]
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PASSWORD
              value: "supersecretpassword"
            - name: REDIS_URL
              value: "redis://redis-master:6379/0"
